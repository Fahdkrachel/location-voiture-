version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: bousselha-db
    restart: always
    environment:
      MYSQL_DATABASE: bousselha_db
      MYSQL_USER: bousselha
      MYSQL_PASSWORD: Bousselha@2026
      MYSQL_ROOT_PASSWORD: BousselhaRoot@2026
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./bousselha-backend
      dockerfile: Dockerfile
    container_name: bousselha-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bousselha_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: bousselha
      SPRING_DATASOURCE_PASSWORD: Bousselha@2026
      JWT_SECRET: changeitchangemechangeitchangemechangeitchangeme
      APP_UPLOADS_DIR: /app/uploads
      APP_ALLOW_FALLBACK_ADMIN: "true"
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: krachelfahd@gmail.com
      SPRING_MAIL_PASSWORD: qhskeomwpxowwqms
      APP_MAIL_FROM: krachelfahd@gmail.com
    volumes:
      - uploads_data:/app/uploads

volumes:
  db_data:
  uploads_data:
