spring.application.name=bousselha-backend
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bousselha_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bousselha}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Bousselha@2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schéma géré manuellement (voir src/main/resources/db/). Pas de migration au démarrage (sera géré par Flyway).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

# JWT properties (change in production via environment variables)
jwt.secret=${JWT_SECRET:changeitchangemechangeitchangemechangeitchangeme}
jwt.expiration-ms=86400000

# Email password reset. Configure these values in production.
app.mail.from=${APP_MAIL_FROM:krachelfahd@gmail.com}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:krachelfahd@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:qhskeomwpxowwqms}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Répertoire d'uploads externe pour la production (valeur par défaut : dossier "uploads" à la racine de l'application)
app.uploads.dir=${APP_UPLOADS_DIR:uploads}

# Autorise la création de l'administrateur par défaut si aucun compte n'existe (conseillé : true en dev, false en prod)
app.security.allow-fallback-admin=${APP_ALLOW_FALLBACK_ADMIN:true}
